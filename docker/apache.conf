<VirtualHost *:${APACHE_PORT}>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Render-Umgebungsvariablen an PHP (mod_php) weiterleiten.
    # Ohne PassEnv sieht PHP getenv() nur die Apache-internen Vars.
    PassEnv KIE_AI_API_KEY
    PassEnv CLEANUP_SECRET

    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type"

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/storage>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    # Replacement images + thumbnails inside jobs must be publicly readable.
    # meta.json and any PHP files stay blocked.
    <Directory /var/www/html/storage/jobs>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "^meta\.json$">
            Require all denied
        </FilesMatch>
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/storage/exports>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/storage/thumbnails>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/data>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/includes>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    # ── SQLite-Datenbankdateien niemals per HTTP ausliefern ──────────────────
    # Primaerschutz (robust, docroot-weit, symlink-unabhaengig): jede Anfrage,
    # deren Dateiname auf eine DB-Endung endet, wird global blockiert. Betrifft
    # KEINE Medien (.jpg/.mp4) und NICHT den /storage-Symlink-Baum.
    <FilesMatch "\.(db|sqlite|sqlite3|db-wal|db-shm)$">
        Require all denied
    </FilesMatch>

    # Zusaetzlicher, gezielter Schutz fuer die Persistent Disk (liegt unter dem
    # DocumentRoot). Bewusst NUR DB-Dateien via verschachteltem FilesMatch —
    # KEIN pauschales Deny des Ordners, damit /storage-Symlink-Medien unberuehrt
    # bleiben.
    <Directory /var/www/html/render-data>
        <FilesMatch "\.(db|sqlite|sqlite3|db-wal|db-shm)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/csf_error.log
    CustomLog ${APACHE_LOG_DIR}/csf_access.log combined
</VirtualHost>